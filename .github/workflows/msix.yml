name: MSIX package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.6'
          architecture: x64
      - name: Build Windows x64 application
        shell: pwsh
        run: python scripts/build_windows.py
      - name: Run regression tests
        shell: pwsh
        run: .venv-build\Scripts\python.exe -m unittest discover -s tests -v
      - name: Build and validate MSIX
        shell: pwsh
        env:
          MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=BandWagon' }}
          MSIX_IDENTITY: ${{ vars.MSIX_IDENTITY || 'loselessss.BandWagon' }}
          MSIX_TIMESTAMP_URL: ${{ vars.MSIX_TIMESTAMP_URL }}
        run: |
          .venv-build\Scripts\python.exe scripts/build_msix.py --store
          if ($LASTEXITCODE -ne 0) { throw 'MSIX packaging/signing failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: BandWagon-MSIX
          path: Output/*.msix
          if-no-files-found: error
          retention-days: 14
